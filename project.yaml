# CCGS project configuration — single source of truth for project settings.
# See .claude/docs/effects-map.md for full schema.

schema_version: 1

framework:
  version: 1.2.0
  last_upgraded: 2026-10-19

project:
  stage: Concept

# NOTE: this template ships with no `modes:` block, and the six knobs below must
# never be added to one.
#
# `/start` DOES add `modes.rigor` and `modes.automation` here — that is its job,
# and a `modes:` block containing those two is the expected state of a configured
# project, not a mistake.
#
# What must stay absent is the six knobs `modes.rigor` FRONTS:
# `modes.review_mode`, `modes.workflow`, `docs.density`, `qa.level`,
# `modes.story_granularity` and `team.size`. Seeding any of them in this file
# pins that value and shadows the rigor expansion, so the rigor `/start` infers
# and saves would stop changing anything. `/start` states the same rule for the
# settings it writes.
#
# Per-developer preferences belong in `project.local.yaml` (gitignored), not
# here. `/settings --local <key>=<value>` writes there; `/settings <key>=<value>`
# edits this file. See `.claude/docs/config-resolution.md` for the full
# precedence order.

modes:
  rigor: standard
  automation: guided

engine:
  name: "Godot"
  version: "4.7.0"
  language: "GDScript"
  rendering: "Forward+"
  physics: "Godot Physics 2D"
  # Windows editor run through WSL interop; not on PATH. Verified: the probe
  # returned 4.7.stable.official.5b4e0cb0f and it read a project.godot under /tmp.
  path: "/mnt/d/softwares/Godot_v4.7-stable_win64.exe/godot47.exe"

specialists:
  code: "godot-gdscript-specialist"
  shader: "godot-shader-specialist"
  ui: "godot-specialist"
  additional: ["godot-gdextension-specialist"]

naming:
  classes: PascalCase
  variables: snake_case
  constants: SCREAMING_SNAKE
  signals: past_tense
  files: snake_case
  scenes: snake_case

commands:
  # TODO: no export_presets.cfg exists yet, and a preset name is project-defined.
  # Set it via /settings once the first export preset exists — guessing a name
  # here would produce a build command that fails with "Unknown export preset".
  build: "[TO BE CONFIGURED]"
  # `--import` is not optional: a fresh clone has no .godot/ class cache and the
  # run exits 1 without one (GdUnitCmdTool.gd does not load). Exit 0 = all pass,
  # 100 = a test failed, 101 = passed but leaked nodes, 105 = a test script does
  # not parse, 1 = the runner never loaded. The two `ERROR:` lines about
  # 127.0.0.1:0 are expected and are not a failure.
  # Requires addons/gdUnit4/ (capital U) -- see tests/README.md.
  test: "/mnt/d/softwares/Godot_v4.7-stable_win64.exe/godot47.exe --headless --path . --import && /mnt/d/softwares/Godot_v4.7-stable_win64.exe/godot47.exe --headless -s -d --remote-debug tcp://127.0.0.1:0 res://addons/gdUnit4/bin/GdUnitCmdTool.gd -a res://tests --ignoreHeadlessMode"
  run: "/mnt/d/softwares/Godot_v4.7-stable_win64.exe/godot47.exe --path . --windowed --resolution 1280x720"
  smoke: "/mnt/d/softwares/Godot_v4.7-stable_win64.exe/godot47.exe --headless --quit-after 5"
